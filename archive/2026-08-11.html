<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Airbnb 羽田競合在庫 2026-08-11</title>

<style>body{font-family:sans-serif;margin:20px;background:#fafafa}h1{font-size:1.2rem}

.card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:10px 16px;text-align:center}

<body>

<div class="cards">
<div class="card"><div class="v">194</div><div class="l">当日</div></div>
<div class="card"><div class="v">496</div><div class="l">1週間後</div></div>
<div class="card"><div class="v">466</div><div class="l">30日後</div></div>
<div class="card"><div class="v">279</div><div class="l">60日後</div></div>
<div class="card"><div class="v">410</div><div class="l">90日後</div></div>
<div class="card"><div class="v">496</div><div class="l">180日後</div></div>
<div class="card"><div class="v">194 / 605</div><div class="l">最小 / 最大</div></div>
</div>
<canvas id="c" height="110"></canvas>
<script>
new Chart(document.getElementById('c'), {type:'line', data:{labels:window.__LABELS,
